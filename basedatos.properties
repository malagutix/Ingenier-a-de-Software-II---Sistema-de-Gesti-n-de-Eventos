# ---------------------------------------------------------------------
# Conexión con PostgreSQL
# ---------------------------------------------------------------------
# Completá la contraseña que elegiste al instalar PostgreSQL.
# La base de datos no hace falta crearla: si no existe, el sistema la
# crea al iniciar, junto con todas las tablas (CDU 007).
#
# Para probar sin PostgreSQL poné habilitado=false: los datos se guardan
# solo en memoria y se pierden al cerrar (modo demostración).

habilitado=true

servidor=localhost
puerto=5432
base=gestion_eventos

usuario=postgres
contrasena=

# Carpeta donde se guarda el respaldo automático diario (se conservan 7)
carpetaRespaldos=respaldos
